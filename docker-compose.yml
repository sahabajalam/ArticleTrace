version: '3.8'

# Master docker-compose for ArticleTrace (orchestrator + knowledge_engine).
# The monitor module was decommissioned — it provided no signal without
# continuous production traffic.

networks:
  compliance-network:
    driver: bridge

services:
  # ========================================
  # ORCHESTRATOR: Scan-driven compliance engine (Port 8004)
  # ========================================
  orchestrator:
    build: ./orchestrator
    container_name: articletrace-orchestrator
    ports:
      - "8004:8004"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=postgresql://postgres:postgres@orchestrator-db:5432/compliance
      - REDIS_URL=redis://orchestrator-redis:6379/0
      - GRAPHRAG_API_URL=http://graphrag-api:8001
      - LOG_LEVEL=INFO
    depends_on:
      orchestrator-db:
        condition: service_healthy
      orchestrator-redis:
        condition: service_started
      graphrag-api:
        condition: service_started
    networks:
      - compliance-network
    restart: unless-stopped

  orchestrator-db:
    image: postgres:15-alpine
    container_name: articletrace-orchestrator-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=compliance
    volumes:
      - orchestrator_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - compliance-network
    restart: unless-stopped

  orchestrator-redis:
    image: redis:7-alpine
    container_name: articletrace-orchestrator-redis
    ports:
      - "6379:6379"
    volumes:
      - orchestrator_redis_data:/data
    networks:
      - compliance-network
    restart: unless-stopped

  # ========================================
  # KNOWLEDGE ENGINE: GraphRAG Legal Research (Port 8001)
  # ========================================
  graphrag-api:
    build: ./knowledge_engine
    container_name: articletrace-knowledge-engine
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    networks:
      - compliance-network
    restart: unless-stopped

volumes:
  orchestrator_postgres_data:
  orchestrator_redis_data:
