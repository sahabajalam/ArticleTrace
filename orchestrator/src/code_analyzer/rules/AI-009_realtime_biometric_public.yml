confidence:
  base: 0.85
  dampeners:
    - when: "file_matches: (^|/)(tests?|docs?|examples?)/"
      factor: 0.5
remediation: >
  AI Act Art 5(1)(h) prohibits real-time remote biometric identification
  systems in publicly accessible spaces for law-enforcement purposes, with
  narrow exceptions (targeted search for victims, prevention of specific
  terrorist threats, localisation of suspects of serious crime) all requiring
  prior judicial authorisation. Any deployment outside those exceptions is
  prohibited; deployments inside them require an authorisation workflow and
  a fundamental-rights impact assessment under Art 27.
