id: AI-009
title: Real-time biometric identification in public-space context
severity: critical
technique: cooccurrence
languages: [python, javascript, typescript]
patterns:
  requires_rule: AI-001
  keywords:
    - cctv
    - public_space
    - public space
    - street
    - square
    - realtime
    - real_time
    - real-time
    - live_stream
    - livestream
    - law_enforcement
    - surveillance
  within_lines: 200
maps_to:
  articles: [AIACT_ART_5]
  obligation_anchors:
    - real-time remote biometric identification
    - publicly accessible spaces
