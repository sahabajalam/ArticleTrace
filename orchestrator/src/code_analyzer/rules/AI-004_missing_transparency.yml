id: AI-004
title: Missing model card / transparency disclosure
severity: medium
technique: file_pattern
languages: [python, javascript, typescript]
patterns:
  mode: absent
  markers:
    - model_card.md
    - MODEL_CARD.md
    - ModelCard.md
    - docs/model_card.md
    - docs/MODEL_CARD.md
    - TRANSPARENCY.md
    - transparency.md
  requires_any_rule: [AI-001, AI-002]
maps_to:
  articles: [AIACT_ART_13, AIACT_ART_50, AIACT_ART_11]
  obligation_anchors:
    - transparency
    - information for users
    - technical documentation
confidence:
  base: 0.75
remediation: >
  AI Act Art 13 requires high-risk systems to be accompanied by instructions
  for use that enable deployers to interpret outputs, including the system's
  intended purpose, accuracy, performance metrics and known limitations.
  Add a `model_card.md` at the repo root describing the models in use,
  training data provenance, intended scope, and known failure modes.
