[project]
name = "eu-ai-knowledge-base"
version = "0.1.0"
description = "EU AI Regulatory Knowledge Base — GDPR + EU AI Act Knowledge Graph and Vector Store"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "neo4j>=5.15.0",
    "chromadb>=0.4.22",
    "google-genai>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
