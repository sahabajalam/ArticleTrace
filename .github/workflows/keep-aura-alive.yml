name: Keep Neo4j Aura Alive

# Aura Free auto-pauses after 3 days of inactivity. We ping every 2 days
# (with a manual trigger as fallback) to keep the instance warm. The job
# is intentionally small and runs in well under a minute, so it stays
# inside the GitHub Actions free tier.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   NEO4J_URI       e.g. neo4j+ssc://<id>.databases.neo4j.io
#   NEO4J_USER      typically "neo4j"
#   NEO4J_PASSWORD  the Aura password

on:
  schedule:
    # 12:00 UTC every 2 days. */2 slips by one day at month boundaries
    # (e.g. Jan 31 → Feb 2 = 2 days, Feb 1 → Feb 3 = 2 days, but the
    # last odd day before month-end can stretch to 3 days). 3 days
    # equals the Aura pause threshold exactly, so workflow_dispatch
    # remains as a manual safety net.
    - cron: "0 12 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install neo4j driver
        run: pip install --quiet "neo4j>=5.15.0"

      - name: Run keep-alive query
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys
          from neo4j import GraphDatabase
          from neo4j.exceptions import ServiceUnavailable, AuthError

          uri  = os.environ["NEO4J_URI"]
          user = os.environ["NEO4J_USER"]
          pwd  = os.environ["NEO4J_PASSWORD"]

          # Mask URI host in logs but show the prefix so we can confirm
          # the right secret was injected.
          host = uri.split("@")[-1].split("/")[-1]
          print(f"Connecting to Aura at {uri.split('://')[0]}://***/{host[:8]}...")

          try:
              driver = GraphDatabase.driver(uri, auth=(user, pwd))
              with driver.session() as s:
                  record = s.run("MATCH (n) RETURN count(n) AS c").single()
                  count = record["c"] if record else 0
              driver.close()
          except AuthError as e:
              print(f"AUTH FAILED: {e}", file=sys.stderr)
              sys.exit(1)
          except ServiceUnavailable as e:
              print(f"SERVICE UNAVAILABLE: {e}", file=sys.stderr)
              sys.exit(1)

          print(f"Aura is alive. Node count: {count}")
          if count < 1000:
              print(
                  f"WARNING: node count ({count}) is unusually low — "
                  "graph may have been wiped or migration regressed.",
                  file=sys.stderr,
              )
          PY
